[profile.default]
src = "src"
out = "out"
test = "test"
evm_version = "osaka"
solc = "0.8.37"
optimizer = true
optimizer_runs = 200
via_ir = true
libs = ["../../../../ethereum/dependencies"]
remappings = ["forge-std=../../../../ethereum/dependencies/forge-std-1.16.2/src/", "ethereum=../../../../ethereum"]

[rpc_endpoints]
hoodi = "${HOODI_RPC_URL}"

[etherscan]
hoodi = { key = "${ETHERSCAN_API_KEY}" }
