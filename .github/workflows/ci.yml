name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  __GEAR_WASM_BUILDER_NO_FEATURES_TRACKING: 1

jobs:
  retained-migration-qualification:
    runs-on: ubuntu-latest
    env:
      MAINNET_MIGRATION_RPC_URL: ${{ secrets.MAINNET_MIGRATION_RPC_URL || 'https://eth-mainnet.public.blastapi.io' }}
      REQUIRE_MAINNET_MIGRATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install Solidity dependencies
        run: forge soldeer install
        working-directory: ./ethereum
      - name: Qualify retained mainnet state
        working-directory: ./ethereum
        run: |
          test -n "$MAINNET_MIGRATION_RPC_URL"
          set -o pipefail
          forge test --threads 1 --match-contract MainnetBridgeMigrationTest -vv | tee migration-qualification.log
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-migration-qualification
          path: ethereum/migration-qualification.log
          if-no-files-found: error

  check-frontend-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      non_frontend_changed: ${{ steps.filter.outputs.non_frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Filter files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'js/frontend/**'
              - 'package.json'
              - 'yarn.lock'
            non_frontend:
              - '**'
              - '!js/frontend/**'
              - '!package.json'
              - '!yarn.lock'
  build:
    needs: check-frontend-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-frontend-changes.outputs.non_frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Install: Linux packages"
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: "Install: binaryen"
        run: |
          wget -c https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz -O - | tar -xz -C .
          sudo cp binaryen-version_123/bin/wasm-opt /usr/bin/

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Install dependencies
        run: forge soldeer install
        working-directory: ./ethereum

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install OpenZeppelin Foundry Upgrades
        run: |
          npm cache clean --force
          # version from ethereum/dependencies/openzeppelin-foundry-upgrades-0.4.1/src/internal/Versions.sol
          npx @openzeppelin/upgrades-core@^1.45.0

      - name: Check ethereum smart-contracts formatting
        run: forge fmt --check
        working-directory: ./ethereum

      - name: Build ethereum smart-contracts
        run: forge build --force
        working-directory: ./ethereum

      - name: Build
        run: cargo build --locked --release --all-targets --features beefy-relay/deployment

      - name: Force build ethereum smart-contracts
        run: forge build --force --no-cache --root ethereum

      - name: Check API files
        run: |
          stored=(
            "./api/ethereum/IBridgingPayment.json"
            "./api/ethereum/IERC20Manager.json"
            "./api/ethereum/IMessageQueue.json"
            "./api/ethereum/WrappedEther.json"
            "./api/ethereum/ERC20Manager.json"
            "./api/ethereum/MessageQueue.json"
            "./api/ethereum/BridgingPayment.json"
            "./api/ethereum/BeefyClient.json"
            "./api/ethereum/VaraQueueRootVerifier.json"

            "./api/gear/bridging_payment.idl"
            "./api/gear/eth_events_deneb.idl"
            "./api/gear/eth_events_electra.idl"
            "./api/gear/vft_manager.idl"
            "./api/gear/vft.idl"
            "./api/gear/vft_vara.idl"
            "./api/gear/historical_proxy.idl"
            "./api/gear/checkpoint_light_client.idl"
          )

          generated=(
            "./ethereum/out/IBridgingPayment.sol/IBridgingPayment.json"
            "./ethereum/out/IERC20Manager.sol/IERC20Manager.json"
            "./ethereum/out/IMessageQueue.sol/IMessageQueue.json"
            "./ethereum/out/WrappedEther.sol/WrappedEther.json"
            "./ethereum/out/ERC20Manager.sol/ERC20Manager.json"
            "./ethereum/out/MessageQueue.sol/MessageQueue.json"
            "./ethereum/out/BridgingPayment.sol/BridgingPayment.json"
            "./ethereum/out/BeefyClient.sol/BeefyClient.json"
            "./ethereum/out/VaraQueueRootVerifier.sol/VaraQueueRootVerifier.json"

            "./target/wasm32-gear/release/bridging_payment.idl"
            "./target/wasm32-gear/release/eth_events_deneb.idl"
            "./target/wasm32-gear/release/eth_events_electra.idl"
            "./target/wasm32-gear/release/vft_manager.idl"
            "./target/wasm32-gear/release/vft.idl"
            "./target/wasm32-gear/release/vft_vara.idl"
            "./target/wasm32-gear/release/historical_proxy.idl"
            "./target/wasm32-gear/release/checkpoint_light_client.idl"
          )

          for i in "${!stored[@]}"; do
            if ! cmp -s "${stored[$i]}" "${generated[$i]}"; then
              echo "API files ${stored[$i]} and ${generated[$i]} don't match."
              diff "${stored[$i]}" "${generated[$i]}"
              exit 1
            fi
          done

  lints:
    needs: check-frontend-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-frontend-changes.outputs.non_frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Install: Linux packages"
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: "Install: binaryen"
        run: |
          wget -c https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz -O - | tar -xz -C .
          sudo cp binaryen-version_123/bin/wasm-opt /usr/bin/

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Install dependencies
        run: forge soldeer install
        working-directory: ./ethereum

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install OpenZeppelin Foundry Upgrades
        run: |
          npm cache clean --force
          # version from ethereum/dependencies/openzeppelin-foundry-upgrades-0.4.1/src/internal/Versions.sol
          npx @openzeppelin/upgrades-core@^1.45.0

      - name: Check ethereum smart-contracts formatting
        run: forge fmt --check
        working-directory: ./ethereum

      - name: Build ethereum smart-contracts
        run: forge build --force
        working-directory: ./ethereum

      - name: Run clippy
        run: cargo clippy --locked --release --all-targets --features beefy-relay/deployment -- -D warnings

      - name: Run rustfmt
        run: cargo fmt -- --check

  tests:
    needs: check-frontend-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-frontend-changes.outputs.non_frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      NODE_CONTAINER_NAME: gear_node${{ github.run_id }}_${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Install: Linux packages"
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: "Install: binaryen"
        run: |
          wget -c https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz -O - | tar -xz -C .
          sudo cp binaryen-version_123/bin/wasm-opt /usr/bin/

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Install dependencies
        run: forge soldeer install
        working-directory: ./ethereum

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install OpenZeppelin Foundry Upgrades
        run: |
          npm cache clean --force
          # version from ethereum/dependencies/openzeppelin-foundry-upgrades-0.4.1/src/internal/Versions.sol
          npx @openzeppelin/upgrades-core@^1.45.0

      - name: Check ethereum smart-contracts formatting
        run: forge fmt --check
        working-directory: ./ethereum

      - name: Build ethereum smart-contracts
        run: forge build --force
        working-directory: ./ethereum

      - name: Pull & run Gear node container
        run: |
          docker pull ghcr.io/gear-tech/node:v2.1.1
          docker run --name $NODE_CONTAINER_NAME --detach --rm --publish 127.0.0.1:9944:9944 ghcr.io/gear-tech/node:v2.1.1 gear --dev --tmp --rpc-external

      - name: Run tests
        run: cargo test --locked --release --workspace --features beefy-relay/deployment
          || { exit_code=$?; if [ x$exit_code != x0 ]; then docker logs $NODE_CONTAINER_NAME; docker stop $NODE_CONTAINER_NAME; fi; exit $exit_code; }

      - name: Run solidity tests
        run: |
          cd ethereum
          forge test --force --threads 1

      - name: Stop Gear node container (if any)
        continue-on-error: true
        run: docker stop $NODE_CONTAINER_NAME
