name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Full commit independently approved in the protected qualification environment
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  __GEAR_WASM_BUILDER_NO_FEATURES_TRACKING: 1

jobs:
  retained-migration-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: bridge-retained-qualification
    permissions:
      contents: read
    env:
      APPROVED_COMMIT: ${{ vars.APPROVED_QUALIFICATION_COMMIT }}
      REQUESTED_COMMIT: ${{ inputs.approved_commit }}
    steps:
      - name: Require independently approved exact commit
        run: |
          if [[ ! "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$REQUESTED_COMMIT" != "$APPROVED_COMMIT" ]]; then
            echo "A matching independently approved full commit is required" >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.APPROVED_QUALIFICATION_COMMIT }}
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install Solidity dependencies
        run: forge soldeer install
        working-directory: ./ethereum
      - name: Qualify retained mainnet state
        working-directory: ./ethereum
        env:
          MAINNET_MIGRATION_RPC_URL: ${{ secrets.MAINNET_MIGRATION_RPC_URL }}
          REQUIRE_MAINNET_MIGRATION: "true"
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const raw = process.env.MAINNET_MIGRATION_RPC_URL;
          if (!raw) throw new Error('Missing independently approved archive endpoint');
          const url = new URL(raw);
          if (url.protocol !== 'https:') throw new Error('Approved archive must use HTTPS');
          const sensitive = [raw, url.username, url.password, ...url.searchParams.values()]
            .filter(Boolean).flatMap(value => [value, decodeURIComponent(value)])
            .sort((a, b) => b.length - a.length);
          const redact = value => sensitive.reduce((text, secret) => text.split(secret).join('[REDACTED]'), value);
          const args = ['test', '--threads', '1', '--match-contract',
            'MainnetBridgeMigrationTest|VaraQueueRootVerifierTest', '--json'];
          const result = spawnSync('forge', args, { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
          fs.writeFileSync('migration-qualification.json', redact(JSON.stringify({
            commit: process.env.APPROVED_COMMIT, command: ['forge', ...args],
            exit: result.status, stdout: result.stdout, stderr: result.stderr,
          }, null, 2)));
          if (result.stderr) process.stderr.write(redact(result.stderr));
          if (result.error || result.status !== 0) throw new Error('Pinned archive qualification failed; see redacted evidence');
          const suites = JSON.parse(result.stdout);
          for (const [contract, test] of [
            ['MainnetBridgeMigrationTest', 'test_DeploymentMainnetBeefyMigration()'],
            ['VaraQueueRootVerifierTest', 'testMainnetForkMigrationPreservesCustodyAndRedeemsLegacyClaim()'],
          ]) {
            const matches = Object.entries(suites).filter(([name]) => name.endsWith(`:${contract}`));
            if (matches.length !== 1 || matches[0][1].test_results[test]?.status !== 'Success') {
              throw new Error(`Required retained-state scenario did not pass: ${contract}.${test}`);
            }
          }
          console.log(`Qualified both retained-state scenarios at ${process.env.APPROVED_COMMIT}`);
          NODE
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-migration-qualification-${{ inputs.approved_commit }}
          path: ethereum/migration-qualification.json
          if-no-files-found: error

  check-frontend-changes:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      non_frontend_changed: ${{ steps.filter.outputs.non_frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Filter files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'js/frontend/**'
              - 'package.json'
              - 'yarn.lock'
            non_frontend:
              - '**'
              - '!js/frontend/**'
              - '!package.json'
              - '!yarn.lock'
  build:
    needs: check-frontend-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-frontend-changes.outputs.non_frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" && git rev-parse HEAD

      - name: Verify reviewed Sails revision in active locks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          reviewed = "3cd30d98a22ad92f0c3ac3a1bf0c2fb360fb75c9"
          # Historical immutable-token fixture locks are deliberately excluded.
          locks = [Path("Cargo.lock"), *sorted(Path("gear-programs").glob("*/Cargo.lock"))]
          for path in locks:
              packages = tomllib.loads(path.read_text())["package"]
              sails = [p for p in packages if p["name"].startswith("sails-")]
              assert sails, f"{path}: missing Sails packages"
              for package in sails:
                  source = package.get("source", "")
                  assert source.startswith("git+https://github.com/gear-tech/sails.git?"), (path, package)
                  assert source.rsplit("#", 1)[-1] == reviewed, (path, package)
          print(f"Reviewed Sails revision verified in {len(locks)} active lockfiles")
          PY

      - name: "Install: Linux packages"
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: "Install: binaryen"
        run: |
          wget -c https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz -O - | tar -xz -C .
          sudo cp binaryen-version_133/bin/wasm-opt /usr/bin/

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Install dependencies
        run: forge soldeer install
        working-directory: ./ethereum

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install OpenZeppelin Foundry Upgrades
        run: |
          npm cache clean --force
          # version from ethereum/dependencies/openzeppelin-foundry-upgrades-0.4.1/src/internal/Versions.sol
          npx @openzeppelin/upgrades-core@^1.45.0

      - name: Check ethereum smart-contracts formatting
        run: forge fmt --check
        working-directory: ./ethereum

      - name: Build ethereum smart-contracts
        run: forge build --force
        working-directory: ./ethereum

      - name: Build
        run: cargo build --locked --release --all-targets --features beefy-relay/deployment

      - name: Force build ethereum smart-contracts
        run: forge build --force --no-cache --root ethereum

      - name: Check API files
        run: |
          stored=(
            "./api/ethereum/IBridgingPayment.json"
            "./api/ethereum/IERC20Manager.json"
            "./api/ethereum/IMessageQueue.json"
            "./api/ethereum/WrappedEther.json"
            "./api/ethereum/ERC20Manager.json"
            "./api/ethereum/MessageQueue.json"
            "./api/ethereum/BridgingPayment.json"
            "./api/ethereum/BeefyClient.json"
            "./api/ethereum/VaraQueueRootVerifier.json"

            "./api/gear/bridging_payment.idl"
            "./api/gear/eth_events_deneb.idl"
            "./api/gear/eth_events_electra.idl"
            "./api/gear/vft_manager.idl"
            "./api/gear/vft.idl"
            "./api/gear/vft_vara.idl"
            "./api/gear/historical_proxy.idl"
            "./api/gear/checkpoint_light_client.idl"
          )

          generated=(
            "./ethereum/out/IBridgingPayment.sol/IBridgingPayment.json"
            "./ethereum/out/IERC20Manager.sol/IERC20Manager.json"
            "./ethereum/out/IMessageQueue.sol/IMessageQueue.json"
            "./ethereum/out/WrappedEther.sol/WrappedEther.json"
            "./ethereum/out/ERC20Manager.sol/ERC20Manager.json"
            "./ethereum/out/MessageQueue.sol/MessageQueue.json"
            "./ethereum/out/BridgingPayment.sol/BridgingPayment.json"
            "./ethereum/out/BeefyClient.sol/BeefyClient.json"
            "./ethereum/out/VaraQueueRootVerifier.sol/VaraQueueRootVerifier.json"

            "./target/wasm32-gear/release/bridging_payment.idl"
            "./target/wasm32-gear/release/eth_events_deneb.idl"
            "./target/wasm32-gear/release/eth_events_electra.idl"
            "./target/wasm32-gear/release/vft_manager.idl"
            "./target/wasm32-gear/release/vft.idl"
            "./target/wasm32-gear/release/vft_vara.idl"
            "./target/wasm32-gear/release/historical_proxy.idl"
            "./target/wasm32-gear/release/checkpoint_light_client.idl"
          )

          for i in "${!stored[@]}"; do
            if ! cmp -s "${stored[$i]}" "${generated[$i]}"; then
              echo "API files ${stored[$i]} and ${generated[$i]} don't match."
              diff "${stored[$i]}" "${generated[$i]}"
              exit 1
            fi
          done

      - name: Install frontend client generation dependencies
        run: yarn install --immutable

      - name: Compare frontend clients with canonical Cargo IDLs
        run: yarn workspace frontend check:sails

  lints:
    needs: check-frontend-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-frontend-changes.outputs.non_frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" && git rev-parse HEAD

      - name: "Install: Linux packages"
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: "Install: binaryen"
        run: |
          wget -c https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz -O - | tar -xz -C .
          sudo cp binaryen-version_133/bin/wasm-opt /usr/bin/

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Install dependencies
        run: forge soldeer install
        working-directory: ./ethereum

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install OpenZeppelin Foundry Upgrades
        run: |
          npm cache clean --force
          # version from ethereum/dependencies/openzeppelin-foundry-upgrades-0.4.1/src/internal/Versions.sol
          npx @openzeppelin/upgrades-core@^1.45.0

      - name: Check ethereum smart-contracts formatting
        run: forge fmt --check
        working-directory: ./ethereum

      - name: Build ethereum smart-contracts
        run: forge build --force
        working-directory: ./ethereum

      - name: Run clippy
        run: cargo clippy --locked --release --all-targets --features beefy-relay/deployment -- -D warnings

      - name: Run rustfmt
        run: cargo fmt -- --check

  tests:
    needs: check-frontend-changes
    if: ${{ github.event_name != 'pull_request' || needs.check-frontend-changes.outputs.non_frontend_changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      NODE_CONTAINER_NAME: gear_node${{ github.run_id }}_${{ github.run_number }}
      GEAR_BRIDGE_OWNED_FIXTURE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify candidate checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" && git rev-parse HEAD

      - name: "Install: Linux packages"
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: "Install: binaryen"
        run: |
          wget -c https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz -O - | tar -xz -C .
          sudo cp binaryen-version_133/bin/wasm-opt /usr/bin/

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Install dependencies
        run: forge soldeer install
        working-directory: ./ethereum

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install OpenZeppelin Foundry Upgrades
        run: |
          npm cache clean --force
          # version from ethereum/dependencies/openzeppelin-foundry-upgrades-0.4.1/src/internal/Versions.sol
          npx @openzeppelin/upgrades-core@^1.45.0

      - name: Check ethereum smart-contracts formatting
        run: forge fmt --check
        working-directory: ./ethereum

      - name: Build ethereum smart-contracts
        run: forge build --force
        working-directory: ./ethereum

      - name: Pull & run Gear node container
        run: |
          docker pull ghcr.io/gear-tech/node:v2.1.1
          docker run --name "$NODE_CONTAINER_NAME" --detach --rm --publish 127.0.0.1:9944:9944 ghcr.io/gear-tech/node:v2.1.1 gear --dev --tmp --rpc-external

      - name: Provision native-test signer ownership
        run: |
          signer_lock_dir="$(realpath "$(mktemp -d "$RUNNER_TEMP/bridge-signers.XXXXXX")")"
          echo "VARA_BRIDGE_SIGNER_LOCK_DIR=$signer_lock_dir" >> "$GITHUB_ENV"

      - name: Run retained-manager regressions
        run: |
          cargo test --locked --release -p tests vft_manager::gtest::test_zero_receiver_rejected_without_economic_effects -- --exact --nocapture --test-threads=1
          cargo test --locked --release -p tests vft_manager::init -- --exact --nocapture --test-threads=1
          cargo test --locked --release -p tests vft_manager::gtest:: -- --test-threads=1
          cargo test --locked --release -p vft-manager-tool mode_bound_counts_and_historical_inference -- --test-threads=1

      - name: Run affected native libraries
        run: cargo test --locked --release -p vft-manager-app -p vft-vara-app -p ethereum-client -p relayer -p beefy-relay --lib

      - name: Run tests
        run: |
          cargo test --locked --release --workspace --features beefy-relay/deployment || {
            exit_code=$?
            docker logs "$NODE_CONTAINER_NAME"
            exit "$exit_code"
          }

      - name: Run solidity tests
        env:
          FOUNDRY_FORCE: "true"
        run: |
          cd ethereum
          forge test --match-contract VaraQueueRootVerifierTest --match-test testAuthenticatedQueueEpochTransitionsRemainAccepted -vvv
          forge test --match-contract VaraQueueRootVerifierTest --match-test testUnchangedQueueMaturityReceiverAndReplay -vvv
          forge test --match-contract ERC20ManagerTest
          forge test --force --threads 1

      - name: Stop Gear node container (if any)
        if: always()
        continue-on-error: true
        run: docker stop "$NODE_CONTAINER_NAME"
