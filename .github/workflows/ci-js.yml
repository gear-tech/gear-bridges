name: CI(js)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-files-changed:
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.changed.outputs.frontend }}
      indexer_changed: ${{ steps.changed.outputs.indexer }}
      common_changed: ${{ steps.changed.outputs.common }}
      bridge_js_changed: ${{ steps.changed.outputs.bridge_js }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check changed files
        id: changed
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'js/frontend/**'
            indexer:
              - 'js/indexer/**'
            common:
              - 'js/common/**'
              - 'api/**'
              - 'tools/beefy-relay/ops/**'
              - 'tools/beefy-relay/src/source.rs'
              - 'tools/beefy-relay/src/tokens.rs'
              - 'tools/beefy-relay/src/tokens_soak.rs'
              - 'package.json'
              - 'yarn.lock'
              - 'lerna.json'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.github/workflows/ci-js.yml'
            bridge_js:
              - 'js/bridge-js/**'

  bridge-js:
    runs-on: ubuntu-latest
    environment: bridge-js-test
    needs: check-files-changed
    if: ${{ needs.check-files-changed.outputs.bridge_js_changed == 'true' || needs.check-files-changed.outputs.common_changed == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt

      - name: 'Install: binaryen'
        run: |
          wget -c https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz -O - | tar -xz -C .
          sudo cp binaryen-version_123/bin/wasm-opt /usr/bin/

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.20.1'

      # TODO: swicth back to `arduino/setup-protoc@v3` after it supports Node 24
      #       https://github.com/arduino/setup-protoc/pull/113
      - name: Install Protoc
        uses: StackOverflowExcept1on/setup-protoc@3c8638272249639ffb4bc8571caff93ee0383579

      - name: 'Install: NodeJS 20.x'
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: 'Install dependencies'
        run: yarn workspaces focus @gear-js/bridge gear-bridges

      - name: 'Build @gear-js/bridge lib'
        run: yarn build:bridge-js

      - name: Typecheck SDK and examples
        run: |
          yarn workspace @gear-js/bridge typecheck
          yarn workspace @gear-js/bridge build:examples
      - name: Offline SDK protocol checks (not live qualification)
        run: yarn workspace @gear-js/bridge test test/vara-to-eth.test.ts test/eth-to-vara.test.ts --mode unit

      - name: Load independently approved inbound fixture profile
        env:
          INBOUND_PROOF_PROFILE_JSON: ${{ secrets.INBOUND_PROOF_PROFILE_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path').join(process.env.RUNNER_TEMP, 'inbound-proof-profile.json');
          const profile = process.env.INBOUND_PROOF_PROFILE_JSON;
          if (!profile) throw new Error('Missing independently approved INBOUND_PROOF_PROFILE_JSON');
          JSON.parse(profile);
          fs.writeFileSync(path, profile, { mode: 0o600, flag: 'wx' });
          fs.appendFileSync(process.env.GITHUB_ENV, `INBOUND_PROOF_PROFILE_PATH=${path}\n`);
          NODE

      - name: 'Build test packages'
        run: cargo build -p js-test --release

      - name: 'Run tests'
        working-directory: js/bridge-js
        run: yarn test
        env:
          HISTORICAL_PROXY_ID: ${{ secrets.HISTORICAL_PROXY_ID }}
          BEACON_RPC_URL: ${{ secrets.BEACON_RPC_URL }}
          VARA_WS_RPC: ${{ secrets.VARA_WS_RPC }}
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          VARA_TO_ETH_BLOCK_NUMBER: ${{ secrets.VARA_TO_ETH_BLOCK_NUMBER }}
          VARA_TO_ETH_NONCE: ${{ secrets.VARA_TO_ETH_NONCE }}

      - name: 'Lint'
        run: yarn lint:bridge-js

  build-indexer:
    runs-on: ubuntu-latest
    needs: check-files-changed
    if: ${{ needs.check-files-changed.outputs.indexer_changed == 'true' || needs.check-files-changed.outputs.common_changed == 'true' || needs.check-files-changed.outputs.bridge_js_changed == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn workspaces focus gear-bridges gear-bridge-common indexer

      - name: Build
        run: yarn build:indexer

      - name: Check finalized receipt and settlement behavior
        run: yarn workspace indexer test

      - name: 'Lint'
        run: yarn lint:indexer

  build-frontend:
    runs-on: ubuntu-latest
    needs: check-files-changed
    if: ${{ needs.check-files-changed.outputs.frontend_changed == 'true' || needs.check-files-changed.outputs.common_changed == 'true' || needs.check-files-changed.outputs.bridge_js_changed == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn workspaces focus frontend gear-bridges gear-bridge-common @gear-js/bridge

      - name: Build
        run: yarn build:frontend

      - name: Typecheck frontend against shared SDK
        run: PATH="$PWD/node_modules/.bin:$PATH" yarn workspace frontend exec tsc -p tsconfig.app.json --noEmit
